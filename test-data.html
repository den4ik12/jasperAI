<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JasperAI — Тест JSON</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */

        .header {
            background: white;
            box-shadow: 0 1px 0 #e2e8f0;
            padding: 0 28px;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo {
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .logo-title { font-size: 14px; font-weight: 700; color: #1e293b; }

        .header-sep {
            width: 1px;
            height: 20px;
            background: #e2e8f0;
        }

        .header-page {
            font-size: 13px;
            font-weight: 600;
            color: #16a34a;
        }

        .header-back {
            margin-left: auto;
            font-size: 12px;
            color: #64748b;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 6px;
            transition: background 0.12s, color 0.12s;
        }
        .header-back:hover { background: #f1f5f9; color: #1e293b; }

        /* ── Main layout ── */

        .main {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 24px 28px;
            min-height: 0;
        }

        /* ── Input panel ── */

        .input-panel {
            width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            overflow: hidden;
        }

        .card-header {
            padding: 14px 16px 0;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #94a3b8;
        }

        .card-body {
            padding: 12px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .drop-zone {
            border: 2px dashed #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            position: relative;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: #16a34a;
            background: #f0fdf4;
        }
        .drop-zone input[type=file] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        .drop-icon { font-size: 24px; margin-bottom: 6px; }
        .drop-text { font-size: 12px; color: #64748b; line-height: 1.5; }
        .drop-text strong { color: #16a34a; }
        .drop-filename {
            font-size: 11px;
            color: #16a34a;
            font-weight: 600;
            font-family: monospace;
            margin-top: 4px;
            word-break: break-all;
        }

        .divider-or {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: #cbd5e1;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .divider-or::before, .divider-or::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        textarea {
            width: 100%;
            height: 260px;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 11px;
            color: #1e293b;
            resize: vertical;
            outline: none;
            line-height: 1.55;
            background: #f8fafc;
        }
        textarea:focus { border-color: #16a34a; background: white; }
        textarea::placeholder { color: #cbd5e1; }

        .btn-run {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: background 0.15s, opacity 0.15s;
        }
        .btn-run:hover:not(:disabled) { background: #15803d; }
        .btn-run:disabled { opacity: 0.4; cursor: not-allowed; }

        .status {
            font-size: 11px;
            color: #94a3b8;
            min-height: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status.error { color: #ef4444; }

        .spinner {
            width: 10px; height: 10px;
            border: 2px solid #bbf7d0;
            border-top-color: #16a34a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Result panel ── */

        .result-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .result-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #cbd5e1;
        }
        .result-empty-icon { font-size: 36px; }
        .result-empty-text { font-size: 13px; }

        .result-card {
            display: none;
            flex: 1;
            flex-direction: column;
            background: white;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            overflow: hidden;
            min-height: 0;
        }
        .result-card.visible { display: flex; }

        .tabs-bar {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            overflow-x: auto;
            flex-shrink: 0;
            padding: 0 4px;
        }
        .tabs-bar::-webkit-scrollbar { display: none; }

        .tab-btn {
            padding: 12px 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            white-space: nowrap;
            transition: color 0.1s, border-color 0.1s;
        }
        .tab-btn:hover:not(.tab-active) { color: #475569; }
        .tab-btn.tab-active { color: #16a34a; border-bottom-color: #16a34a; }

        .variants-body {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .variant-panel {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 16px 20px 20px;
            overflow: hidden;
            min-height: 0;
        }
        .variant-panel.active { display: flex; }

        .variant-desc {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .json-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            min-height: 0;
        }

        .json-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #1e293b;
            flex-shrink: 0;
        }

        .json-lang {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .records-count {
            font-size: 10px;
            color: #475569;
            font-weight: 600;
        }

        .copy-btn {
            padding: 4px 10px;
            background: #334155;
            border: none;
            border-radius: 4px;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .copy-btn:hover { background: #475569; color: #e2e8f0; }
        .copy-btn.copied { background: #166534; color: #86efac; }

        .json-pre {
            flex: 1;
            overflow: auto;
            margin: 0;
            padding: 14px 16px;
            background: #0f172a;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre;
        }

        .json-pre .jk { color: #93c5fd; }
        .json-pre .js { color: #86efac; }
        .json-pre .jn { color: #fbbf24; }
        .json-pre .jb { color: #f472b6; }
        .json-pre .jnull { color: #94a3b8; font-style: italic; }
    </style>
</head>
<body>

<div class="header">
    <a class="logo-row" href="editor.html">
        <div class="logo">J</div>
        <div class="logo-title">JasperAI</div>
    </a>
    <div class="header-sep"></div>
    <div class="header-page">Тест JSON</div>
    <a class="header-back" href="editor.html">← Редактор</a>
</div>

<div class="main">

    <!-- Left: input -->
    <div class="input-panel">
        <div class="card">
            <div class="card-header">JRXML файл</div>
            <div class="card-body">
                <div class="drop-zone" id="dropZone">
                    <input type="file" accept=".jrxml,.xml" id="fileInput" onchange="handleFile(this)">
                    <div class="drop-icon">📄</div>
                    <div class="drop-text">
                        <strong>Выберите файл</strong> или перетащите сюда<br>
                        .jrxml / .xml
                    </div>
                    <div class="drop-filename" id="dropFilename"></div>
                </div>

                <div class="divider-or">или</div>

                <textarea id="jrxmlInput" placeholder="Вставьте JRXML сюда..."></textarea>
            </div>
        </div>

        <div class="card">
            <div class="card-body" style="padding-top:14px">
                <button class="btn-run" id="runBtn" onclick="doGenerate()">
                    ⚡ Сгенерировать тестовые данные
                </button>
                <div class="status" id="status"></div>
            </div>
        </div>
    </div>

    <!-- Right: results -->
    <div class="result-panel">
        <div class="result-empty" id="resultEmpty">
            <div class="result-empty-icon">{ }</div>
            <div class="result-empty-text">Результаты появятся здесь</div>
        </div>
        <div class="result-card" id="resultCard">
            <div class="tabs-bar" id="tabsBar"></div>
            <div class="variants-body" id="variantsBody"></div>
        </div>
    </div>

</div>

<script>
    const API = 'http://localhost:8080/api/report';

    let busy = false;

    // ── File drop ─────────────────────────────────────────────────────────

    const dropZone = document.getElementById('dropZone');

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) loadFile(file);
    });

    function handleFile(input) {
        if (input.files[0]) loadFile(input.files[0]);
    }

    function loadFile(file) {
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById('jrxmlInput').value = e.target.result;
            document.getElementById('dropFilename').textContent = file.name;
        };
        reader.readAsText(file);
    }

    // ── Generate ──────────────────────────────────────────────────────────

    async function doGenerate() {
        const jrxml = document.getElementById('jrxmlInput').value.trim();
        if (!jrxml) {
            setStatus('Вставьте или загрузите JRXML', true);
            return;
        }
        if (busy) return;

        setBusy(true);
        setStatus('Генерация...', false, true);
        showEmpty(false);
        showCard(false);

        try {
            const res = await fetch(API + '/test-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jrxml })
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const variants = await res.json();
            renderVariants(variants);
            setStatus('');
        } catch (e) {
            setStatus('Ошибка: ' + e.message, true);
            showEmpty(true);
        } finally {
            setBusy(false);
        }
    }

    function setBusy(val) {
        busy = val;
        document.getElementById('runBtn').disabled = val;
    }

    function setStatus(text, isError, loading) {
        const el = document.getElementById('status');
        el.className = 'status' + (isError ? ' error' : '');
        el.innerHTML = loading
            ? `<div class="spinner"></div>${text}`
            : text;
    }

    function showEmpty(show) {
        document.getElementById('resultEmpty').style.display = show ? 'flex' : 'none';
    }

    function showCard(show) {
        document.getElementById('resultCard').classList.toggle('visible', show);
    }

    // ── Render results ────────────────────────────────────────────────────

    function renderVariants(variants) {
        const tabs = document.getElementById('tabsBar');
        const body = document.getElementById('variantsBody');

        tabs.innerHTML = '';
        body.innerHTML = '';

        variants.forEach((v, i) => {
            const tab = document.createElement('button');
            tab.className = 'tab-btn' + (i === 0 ? ' tab-active' : '');
            tab.textContent = v.name;
            tab.onclick = () => switchTab(i);
            tabs.appendChild(tab);

            const count = Array.isArray(v.records) ? v.records.length : '?';

            const panel = document.createElement('div');
            panel.className = 'variant-panel' + (i === 0 ? ' active' : '');
            panel.id = 'panel-' + i;
            panel.innerHTML = `
                <div class="variant-desc">${escHtml(v.description || '')}</div>
                <div class="json-wrap">
                    <div class="json-toolbar">
                        <span class="json-lang">JSON</span>
                        <div class="toolbar-right">
                            <span class="records-count">${count} ${plural(count, 'запись', 'записи', 'записей')}</span>
                            <button class="copy-btn" id="copy-${i}" onclick="copyJson(${i})">
                                <span>⎘</span> Копировать
                            </button>
                        </div>
                    </div>
                    <pre class="json-pre" id="json-${i}">${highlightJson(JSON.stringify(v.records, null, 2))}</pre>
                </div>
            `;
            body.appendChild(panel);
        });

        showEmpty(false);
        showCard(true);
    }

    function switchTab(index) {
        document.querySelectorAll('.tab-btn').forEach((b, i) =>
            b.classList.toggle('tab-active', i === index));
        document.querySelectorAll('.variant-panel').forEach((p, i) =>
            p.classList.toggle('active', i === index));
    }

    function copyJson(index) {
        const pre = document.getElementById('json-' + index);
        const btn = document.getElementById('copy-' + index);
        navigator.clipboard.writeText(pre.innerText).then(() => {
            btn.classList.add('copied');
            btn.innerHTML = '<span>✓</span> Скопировано';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = '<span>⎘</span> Копировать';
            }, 2000);
        });
    }

    // ── Helpers ───────────────────────────────────────────────────────────

function plural(n, one, few, many) {
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod100 >= 11 && mod100 <= 14) return many;
        if (mod10 === 1) return one;
        if (mod10 >= 2 && mod10 <= 4) return few;
        return many;
    }

    function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightJson(json) {
        return escHtml(json)
            .replace(/(&quot;(?:[^&]|&(?!quot;))*&quot;)\s*:/g, '<span class="jk">$1</span>:')
            .replace(/:\s*(&quot;(?:[^&]|&(?!quot;))*&quot;)/g, ': <span class="js">$1</span>')
            .replace(/:\s*(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g, ': <span class="jn">$1</span>')
            .replace(/:\s*(true|false)/g, ': <span class="jb">$1</span>')
            .replace(/:\s*(null)/g, ': <span class="jnull">$1</span>');
    }

    // ── Keyboard ──────────────────────────────────────────────────────────

    document.getElementById('jrxmlInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) doGenerate();
    });

    // ── Init ──────────────────────────────────────────────────────────────

    showEmpty(true);
    showCard(false);

    const preloaded = localStorage.getItem('jasperai_jrxml');
    if (preloaded) {
        localStorage.removeItem('jasperai_jrxml');
        document.getElementById('jrxmlInput').value = preloaded;
        document.getElementById('dropFilename').textContent = 'из редактора';
        doGenerate();
    }
</script>
</body>
</html>
